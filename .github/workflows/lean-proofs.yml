name: Lean proofs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Prove, audit, recheck, and compare Python behavior
        run: python tools/check_lean.py
      - name: Test proof tooling without model weights
        run: python -m unittest discover -s tests -p test_formal_tools.py -v
