name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
      - name: Install compiler test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang lld llvm bubblewrap libseccomp2
          command -v gcc clang ld.lld llvm-mc bwrap
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run shared source checks
        run: uv run --locked python tools/check.py
